<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نمودار طلای ۱۸ عیار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: one column, price headline on top, chart in the middle, range tabs and stats below. */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --fg:#14181f; --muted:#5d6675; --line:#dfe3e9;
  --accent:#a8780f; --accent-soft:rgba(168,120,15,.16);
  --up:#13795b; --down:#c0392b;
  --font:"Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --panel:#151c25; --fg:#eef1f5; --muted:#93a0b2; --line:#26303d;
    --accent:#e0b04a; --accent-soft:rgba(224,176,74,.20);
    --up:#3ecf9b; --down:#ff7a6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#151c25; --fg:#eef1f5; --muted:#93a0b2; --line:#26303d;
  --accent:#e0b04a; --accent-soft:rgba(224,176,74,.20);
  --up:#3ecf9b; --down:#ff7a6b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.6;
  padding-block:max(16px, env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.05rem;font-weight:800;margin:0;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill[data-state="ok"] .dot{background:var(--up)}
.pill[data-state="err"] .dot{background:var(--down)}
.pill[data-state="cache"] .dot{background:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{color:var(--muted);font-size:.85rem}
.chg{font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.sub{color:var(--muted);font-size:.8rem;margin-top:2px}
.chart-box{position:relative;margin-top:10px;touch-action:pan-y}
.chart-box svg{display:block;width:100%;height:auto;direction:ltr}
.tip{position:absolute;top:0;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums;transform:translateX(-50%);z-index:2}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{font:inherit;font-size:.82rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.tab[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{min-width:0}
.stat b{display:block;font-size:1rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.75rem}
.empty{color:var(--muted);text-align:center;padding:48px 8px;font-size:.9rem}
.btn{font:inherit;font-size:.8rem;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
details{color:var(--muted);font-size:.78rem}
details pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;font-size:.74rem}
footer{color:var(--muted);font-size:.74rem}
@media (prefers-reduced-motion: no-preference){ .price{transition:opacity .2s} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>قیمت هر گرم طلای ۱۸ عیار</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="pill" id="status" data-state="load"><i class="dot"></i><span id="statusText">در حال دریافت…</span></span>
      <button class="btn" id="refresh" type="button">به‌روزرسانی</button>
    </div>
  </header>

  <section class="card" aria-live="polite">
    <div class="price-row">
      <span class="price" id="price">—</span>
      <span class="unit">تومان</span>
      <span class="chg" id="chg"></span>
    </div>
    <div class="sub" id="updated"></div>
    <div class="chart-box" id="chartBox"></div>
    <div class="tabs" role="group" aria-label="بازه‌ی نمودار" id="tabs">
      <button class="tab" type="button" data-r="live" aria-pressed="false">زنده (همین مرورگر)</button>
      <button class="tab" type="button" data-r="7" aria-pressed="false">۷ روز</button>
      <button class="tab" type="button" data-r="30" aria-pressed="true">۳۰ روز</button>
      <button class="tab" type="button" data-r="90" aria-pressed="false">۹۰ روز</button>
      <button class="tab" type="button" data-r="365" aria-pressed="false">۱ سال</button>
    </div>
  </section>

  <section class="card stats" id="stats" aria-label="خلاصه‌ی بازه"></section>

  <details>
    <summary>جزئیات اتصال</summary>
    <pre id="diag"></pre>
  </details>

  <footer>
    منبع داده: TGJU، از طریق سرویس رایگان iran-market. این سرویس هر ۳۰ دقیقه به‌روز می‌شود، پس نمودار «لحظه‌ای» به همین اندازه دقیق است. قیمت‌ها فقط برای اطلاع‌رسانی است و برای خرید و فروش باید با بازار تطبیق داده شوند.
  </footer>
</div>

<script>
const SRC = {
  latest:  "https://iran-market.github.io/data/latest-toman.json",
  history: "https://iran-market.github.io/data/history/GOLD_18K_IRR.json"
};
const POLL_MS = 5 * 60 * 1000;

// <pure>
const FA = "۰۱۲۳۴۵۶۷۸۹";
function toFa(s){ return String(s).replace(/\d/g, d => FA[d]); }
function num(v){
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  const s = v.replace(/[,٬\s]/g, "")
             .replace(/[۰-۹]/g, d => FA.indexOf(d))
             .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function pick(o, keys){
  if (!o) return null;
  for (const k of keys){ const n = num(o[k]); if (n != null) return n; }
  return null;
}
function listOf(payload){
  const l = Array.isArray(payload) ? payload : (payload && (payload.data || payload.items || payload.prices || payload.candles)) || [];
  return Array.isArray(l) ? l : Object.values(l);
}
function findGold18(payload){
  const arr = listOf(payload);
  const bySymbol = arr.find(x => x && /GOLD[_\- ]?18|GERAM[_\- ]?18|GRAM[_\- ]?18/i.test(String(x.symbol || x.code || x.key || "")) && !/MITHQAL|MESGHAL|مثقال/i.test(String(x.symbol || x.name_fa || x.name || "")));
  if (bySymbol) return bySymbol;
  return arr.find(x => {
    const n = String((x && (x.name_fa || x.title_fa || x.name || x.title)) || "");
    return /طلا/.test(n) && /(۱۸|18)/.test(n) && !/مثقال|انس|ounce/i.test(n);
  }) || null;
}
// Gram price of 18k gold is tens of millions of toman; above 1e8 it must be rial.
function toToman(v){ return v == null ? null : (v > 1e8 ? v / 10 : v); }
function parseLatest(payload){
  const it = findGold18(payload);
  if (!it) return null;
  const price = toToman(pick(it, ["price", "close", "last", "value", "current"]));
  if (price == null) return null;
  const pct = pick(it, ["change_percent", "change_pct", "daily_change_percent", "daily_change_pct", "changePercent", "percent"]);
  const meta = (payload && payload.meta) || {};
  const time = meta.published_at || it.updated_at_tehran || it.updated_at || it.timestamp || null;
  return { price, pct, time, keys: Object.keys(it) };
}
function parseHistory(payload){
  const out = [];
  for (const c of listOf(payload)){
    const close = pick(c, ["close", "c", "price", "value"]);
    if (close == null) continue;
    const label = String(c.date_jalali || c.date || c.time || c.timestamp || "");
    out.push({ y: toToman(close), label, t: Date.parse(c.date || c.timestamp || c.time || "") || null });
  }
  return out;
}
function sliceRange(points, days){ return points.slice(-(days + 1)); }
function niceTicks(min, max, n){
  const span = max - min || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(v);
  return out;
}
// </pure>

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const state = { history: store.get("g18.history", []), live: store.get("g18.live", []), latest: store.get("g18.latest", null), range: "30", fresh: false };
const diag = [];
function log(m){ diag.push(new Date().toLocaleTimeString("en-GB") + "  " + m); $("diag").textContent = diag.slice(-12).join("\n"); }

function fmtToman(v){ return toFa(Math.round(v).toLocaleString("en-US").replace(/,/g, "٬")); }
function fmtMil(v){ return toFa((v / 1e6).toFixed(2).replace(/\.?0+$/, "").replace(".", "٫")); }
function fmtTime(t){
  const d = new Date(t); if (isNaN(d)) return "";
  return toFa(d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tehran" }));
}
function setStatus(kind, text){ $("status").dataset.state = kind; $("statusText").textContent = text; }

async function getJSON(url){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(url + "?t=" + Date.now(), { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}

async function refresh(){
  setStatus("load", "در حال دریافت…");
  let okLatest = false, okHist = false;
  try {
    const p = await getJSON(SRC.latest);
    const l = parseLatest(p);
    if (!l) throw new Error("نماد طلای ۱۸ عیار در پاسخ پیدا نشد");
    state.latest = l; store.set("g18.latest", l); okLatest = true;
    log("latest ok: " + l.price + " | fields: " + l.keys.join(","));
    const last = state.live[state.live.length - 1], t = Date.now();
    if (!last || last.p !== l.price || t - last.t > 25 * 60 * 1000){
      state.live.push({ t, p: l.price }); state.live = state.live.slice(-300); store.set("g18.live", state.live);
    }
  } catch(e){ log("latest FAIL: " + e.message); }
  try {
    const p = await getJSON(SRC.history);
    const h = parseHistory(p);
    if (h.length < 2) throw new Error("سری تاریخی خالی یا ناشناخته است");
    state.history = h; store.set("g18.history", h); okHist = true;
    log("history ok: " + h.length + " rows, last " + h[h.length - 1].label);
  } catch(e){ log("history FAIL: " + e.message); }
  state.fresh = okLatest || okHist;
  if (okLatest && okHist) setStatus("ok", "متصل · " + (state.latest.time ? fmtTime(state.latest.time) : fmtTime(Date.now())));
  else if (okLatest || okHist) setStatus("cache", "بخشی از داده");
  else setStatus(state.latest || state.history.length ? "cache" : "err", state.latest || state.history.length ? "داده‌ی ذخیره‌شده" : "اتصال برقرار نشد");
  render();
}

function currentPoints(){
  if (state.range === "live") return state.live.map(x => ({ y: x.p, label: fmtTime(x.t), t: x.t }));
  return sliceRange(state.history, +state.range).map(p => ({ y: p.y, label: toFa(p.label), t: p.t }));
}

function render(){
  const l = state.latest;
  $("price").textContent = l ? fmtToman(l.price) : "—";
  const chg = $("chg");
  if (l && l.pct != null){
    chg.textContent = (l.pct >= 0 ? "▲ " : "▼ ") + toFa(Math.abs(l.pct).toFixed(2).replace(".", "٫")) + "٪";
    chg.className = "chg " + (l.pct >= 0 ? "up" : "down");
  } else { chg.textContent = ""; chg.className = "chg"; }
  $("updated").textContent = l && l.time ? "آخرین انتشار منبع: " + fmtTime(l.time) + " (به وقت تهران)" : "";
  const pts = currentPoints();
  drawChart(pts);
  const stats = $("stats");
  if (pts.length){
    const ys = pts.map(p => p.y), hi = Math.max(...ys), lo = Math.min(...ys), avg = ys.reduce((a, b) => a + b, 0) / ys.length;
    stats.innerHTML = [["بیشترین", hi], ["کمترین", lo], ["میانگین", avg]].map(([k, v]) => `<div class="stat"><b>${fmtToman(v)}</b><span>${k} (تومان)</span></div>`).join("");
  } else stats.innerHTML = "";
}

function drawChart(pts){
  const box = $("chartBox");
  if (pts.length < 2){
    box.innerHTML = `<div class="empty">${state.range === "live" ? "نمودار زنده با هر به‌روزرسانی در همین مرورگر کامل می‌شود. چند دقیقه‌ی دیگر دوباره سر بزن." : "داده‌ای برای نمایش نیست. اتصال را در «جزئیات اتصال» ببین."}</div>`;
    return;
  }
  const W = Math.max(280, box.clientWidth), H = Math.round(Math.min(340, Math.max(220, W * 0.6)));
  const m = { l: 8, r: 46, t: 14, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo || hi * 0.01) * 0.12; lo -= pad; hi += pad;
  const X = i => m.l + (i / (pts.length - 1)) * iw, Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const ticks = niceTicks(lo, hi, 4);
  const line = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join("");
  const area = line + `L${X(pts.length - 1).toFixed(1)} ${m.t + ih}L${X(0).toFixed(1)} ${m.t + ih}Z`;
  const xi = [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  const grid = ticks.map(v => `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${W - 4}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtMil(v)}</text>`).join("");
  const xl = xi.map((i, k) => `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${pts[i].label}</text>`).join("");
  const lastX = X(pts.length - 1), lastY = Y(pts[pts.length - 1].y);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="نمودار قیمت طلای ۱۸ عیار">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    ${grid}${xl}
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="var(--accent)"/>
    <line id="cv" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle id="cd" r="4.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;
  const hit = $("hit"), cv = $("cv"), cd = $("cd"), tip = $("tip");
  function at(ev){
    const r = hit.getBoundingClientRect();
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(((ev.clientX - r.left) / r.width) * (pts.length - 1))));
    const x = X(i), y = Y(pts[i].y);
    cv.setAttribute("x1", x); cv.setAttribute("x2", x); cv.setAttribute("visibility", "visible");
    cd.setAttribute("cx", x); cd.setAttribute("cy", y); cd.setAttribute("visibility", "visible");
    tip.hidden = false; tip.textContent = pts[i].label + " · " + fmtToman(pts[i].y) + " تومان";
    const tw = tip.offsetWidth / 2; tip.style.left = Math.max(tw, Math.min(W - tw, x)) + "px";
  }
  function off(){ cv.setAttribute("visibility", "hidden"); cd.setAttribute("visibility", "hidden"); tip.hidden = true; }
  hit.addEventListener("pointermove", at); hit.addEventListener("pointerdown", at); hit.addEventListener("pointerleave", off);
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.range = b.dataset.r;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t === b)));
  render();
});
$("refresh").addEventListener("click", refresh);
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - (state.live.length ? state.live[state.live.length - 1].t : 0) > POLL_MS) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);

render();
refresh();
</script>
</body>
</html>
